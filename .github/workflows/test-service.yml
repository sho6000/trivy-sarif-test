name: Build and Push Test Service Image

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_NAME="trivy-sarif-test-app"
          IMAGE_TAG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG} .

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}
          echo "Pushed Docker image: ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

  cve-scan:
    needs: build-and-push
    if: needs.build-and-push.outputs.image != ''
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    uses: ./.github/workflows/cve-check.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
