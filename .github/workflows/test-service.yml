name: Build and Push Test Service Image

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - '*-test*'   # Only test/candidate tags build+scan+push here; real release tags go through promote.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Required to upload SARIF files to Security tab
      actions: read           # Required for upload-sarif to process results
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_NAME="trivy-sarif-test-app"
          IMAGE_TAG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG} .

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # Scan the locally-built image, non-blocking, produce SARIF
      - name: Scan image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: CRITICAL
          exit-code: '0'

      # Always upload whatever was found, even if we're about to block the push
      - name: Upload CRITICAL findings to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      # Block the push if any CRITICAL vulnerability was found
      - name: Block push if CRITICAL found
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('trivy-results.sarif')); print(len(d['runs'][0].get('results', [])))")
          echo "CRITICAL findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "CRITICAL vulnerability found — blocking push."
            exit 1
          fi

      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}
          echo "Pushed Docker image: ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

